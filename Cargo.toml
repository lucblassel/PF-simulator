[package]
name = "pf-simulator"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
raw-benchmark = []

[[example]]
name = "benchmark_output"
required-features = ["raw-benchmark"]

[[bin]]
name = "pf-sim"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
phylotree = { git="https://github.com/lucblassel/phylotree-rs", branch="v0.2.0", default-features = false }
rand = "=0.8.5"
rand_distr = "0.4.3"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde_json = "1.0"
tar = "0.4.46"

# The native build script uses only the standard library.
